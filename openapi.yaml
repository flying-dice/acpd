    AcpLoadSessionRequest:
      description: |-
        Request parameters for loading an existing session.

        Only available if the Agent supports the `loadSession` capability.

        See protocol docs: [Loading Sessions](https://agentclientprotocol.com/protocol/v1/draft/session-setup#loading-sessions)
      type: object
      properties:
        mcpServers:
          description: List of MCP servers to connect to for this session.
          type: array
          items:
            $ref: "#/components/schemas/AcpMcpServer"
          x-deserialize-default-on-null: true
        cwd:
          description: The working directory for this session. Must be an absolute path.
          type: string
        additionalDirectories:
          description: >-
            Additional workspace roots to activate for this session. Each path
            MUST be absolute.


            When omitted or empty, no additional roots are activated. When
            non-empty,

            this is the complete resulting additional-root list for the loaded

            session. It MAY differ from any previously used or reported list as
            long as

            the request `cwd` matches the session's `cwd`.
          type: array
          items:
            type: string
          x-deserialize-default-on-null: true
        sessionId:
          description: The ID of the session to load.
          allOf:
            - $ref: "#/components/schemas/AcpSessionId"
        systemPrompt:
          description: >-
            System-level instructions for the loaded session.


            Optional. Omitted and `null` are equivalent. The Agent MAY then keep
            a

            system prompt it stored with the session or use its default
            instructions.

            Clients MUST only send this when the Agent advertises

            `sessionCapabilities.systemPrompt`, and SHOULD send the same value
            they used

            when the session was created.
