      description: >-
        Notification that the enclosing parent session created and owns a child
        session.


        Later updates modify the existing association's metadata, not its
        ownership.


        Sent on the immediate parent session. The first update for an unknown

        `sessionId` announces the child and MUST be sent

        before any live child traffic or live message naming the child as sender

        or recipient. Parents may message and reuse an announced child across

        multiple operations.

        Child events are delivered automatically on the same connection. No
        child

        load, resume, or subscription is needed.


        Only the subagent session ID is required. Omitted patch fields keep
        their

        previous values. `null` clears them. Clearing capabilities disables
        child

        mutations. Clearing state leaves current activity unset/unconfirmed: it
        does

        not imply idle, stop work, or create an `unknown` state snapshot. A
        concrete

        state replaces the entire previous state object, not the session.

        The title and description provide the parent's display metadata for the

        child. They do not replace the content of individual messages or
        operations.

        `cwd` and `additionalDirectories` report where the Agent placed the
        child.

        While unset, each inherits the immediate parent's effective value.
      type: object
