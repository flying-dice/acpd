                - $ref: "#/components/schemas/AcpSetSessionTitleResponse"
                - $ref: "#/components/schemas/AcpResumeSessionResponse"
                - $ref: "#/components/schemas/AcpCloseSessionResponse"
                - $ref: "#/components/schemas/AcpSetSessionModeResponse"
                - $ref: "#/components/schemas/AcpSetSessionConfigOptionResponse"
                - $ref: "#/components/schemas/AcpPromptResponse"
        - $ref: "#/components/schemas/JsonRpcErrorResponse"
        - allOf:
            - anyOf:
                - $ref: "#/components/schemas/JsonRpcRequest"
                - $ref: "#/components/schemas/JsonRpcNotification"
            - properties:
                method:
                  pattern: ^_
    AcpAgentRequest:
      description: A JSON-RPC request object.
      type: object
      properties:
        id:
          description: The request id used to correlate the matching response.
          allOf:
            - $ref: "#/components/schemas/AcpRequestId"
        method:
          description: The method name to invoke.
          type: string
        params:
          description: Method-specific request parameters.
          anyOf:
            - description: >-
                All possible requests that an agent can send to a client.


                This enum is used internally for routing RPC requests. You
                typically won't need

                to use this directly.


                This enum encompasses all method calls from agent to client.
              anyOf:
                - title: WriteTextFileRequest
                  description: |-
                    Writes content to a text file in the client's file system.

                    Only available if the client advertises the `fs.writeTextFile` capability.
                    Allows the agent to create or modify files within the client's environment.

                    See protocol docs: [Client](https://agentclientprotocol.com/protocol/v1/draft/overview#client)
                  allOf:
                    - $ref: "#/components/schemas/AcpWriteTextFileRequest"
                - title: ReadTextFileRequest
                  description: |-
                    Reads content from a text file in the client's file system.

                    Only available if the client advertises the `fs.readTextFile` capability.
                    Allows the agent to access file contents within the client's environment.

                    See protocol docs: [Client](https://agentclientprotocol.com/protocol/v1/draft/overview#client)
                  allOf:
                    - $ref: "#/components/schemas/AcpReadTextFileRequest"
                - title: RequestPermissionRequest
                  description: |-
                    Requests permission from the user for a tool call operation.

                    Called by the agent when it needs user authorization before executing
                    a potentially sensitive operation. The client should present the options
                    to the user and return their decision.

                    If the client cancels the prompt turn via `session/cancel`, it MUST
                    respond to this request with the `cancelled` outcome.

                    See protocol docs: [Requesting Permission](https://agentclientprotocol.com/protocol/v1/draft/tool-calls#requesting-permission)
                  allOf:
                    - $ref: "#/components/schemas/AcpRequestPermissionRequest"
                - title: CreateTerminalRequest
                  description: |-
                    Executes a command in a new terminal

                    Only available if the `terminal` Client capability is set to `true`.

                    Returns a `TerminalId` that can be used with other terminal methods
                    to get the current output, wait for exit, and kill the command.

                    The `TerminalId` can also be used to embed the terminal in a tool call
                    by using `terminal` tool call content.

                    The Agent is responsible for releasing the terminal by using the `terminal/release`
                    method.

                    See protocol docs: [Terminals](https://agentclientprotocol.com/protocol/v1/draft/terminals)
                  allOf:
                    - $ref: "#/components/schemas/AcpCreateTerminalRequest"
                - title: TerminalOutputRequest
                  description: |-
                    Gets the terminal output and exit status

                    Returns the current content in the terminal without waiting for the command to exit.
                    If the command has already exited, the exit status is included.

                    See protocol docs: [Terminals](https://agentclientprotocol.com/protocol/v1/draft/terminals)
                  allOf:
                    - $ref: "#/components/schemas/AcpTerminalOutputRequest"
                - title: ReleaseTerminalRequest
                  description: |-
                    Releases a terminal

                    The command is killed if it hasn't exited yet. Use `terminal/wait_for_exit`
                    to wait for the command to exit before releasing the terminal.

                    After release, the `TerminalId` can no longer be used with other `terminal/*` methods,
                    but tool calls that already contain it, continue to display its output.

                    The `terminal/kill` method can be used to terminate the command without releasing
                    the terminal, allowing the Agent to call `terminal/output` and other methods.

                    See protocol docs: [Terminals](https://agentclientprotocol.com/protocol/v1/draft/terminals)
                  allOf:
                    - $ref: "#/components/schemas/AcpReleaseTerminalRequest"
                - title: WaitForTerminalExitRequest
                  description: |-
                    Waits for the terminal command to exit and return its exit status

                    See protocol docs: [Terminals](https://agentclientprotocol.com/protocol/v1/draft/terminals)
                  allOf:
                    - $ref: "#/components/schemas/AcpWaitForTerminalExitRequest"
                - title: KillTerminalRequest
                  description: |-
                    Kills the terminal command without releasing the terminal

                    While `terminal/release` will also kill the command, this method will keep
                    the `TerminalId` valid so it can be used with other methods.

                    This method can be helpful when implementing command timeouts which terminate
                    the command as soon as elapsed, and then get the final output so it can be sent
                    to the model.

                    Note: Call `terminal/release` when `TerminalId` is no longer needed.

                    See protocol docs: [Terminals](https://agentclientprotocol.com/protocol/v1/draft/terminals)
                  allOf:
                    - $ref: "#/components/schemas/AcpKillTerminalRequest"
                - title: CreateElicitationRequest
                  description: |-
                    Requests structured user input via a form or URL.

                    See protocol docs: [Elicitation](https://agentclientprotocol.com/protocol/v1/draft/elicitation)
                  allOf:
                    - $ref: "#/components/schemas/AcpCreateElicitationRequest"
                - title: MessageMcpRequest
                  description: >-
                    **UNSTABLE**


                    This capability is not part of the spec yet, and may be
                    removed or changed at any point.


                    Exchanges an MCP-over-ACP message.
                  allOf:
                    - $ref: "#/components/schemas/AcpMessageMcpRequest"
                - title: ExtMethodRequest
                  description: |-
                    Handles extension method requests from the agent.

                    Allows the Agent to send an arbitrary request that is not part of the ACP spec.
                    Extension methods provide a way to add custom functionality while maintaining
                    protocol compatibility.

                    See protocol docs: [Extensibility](https://agentclientprotocol.com/protocol/v1/draft/extensibility)
                  allOf:
                    - $ref: "#/components/schemas/AcpExtRequest"
            - type: "null"
      required:
        - id
        - method
      x-docs-ignore: true
    AcpRequestId:
      description: >-
        JSON RPC Request Id


        An identifier established by the Client that MUST contain a String,
        Number, or NULL value if included. If it is not included it is assumed
        to be a notification. The value SHOULD normally not be Null \[1\] and
        Numbers SHOULD NOT contain fractional parts \[2\]


        The Server MUST reply with the same value in the Response object if
        included. This member is used to correlate the context between the two
        objects.


        \[1\] The use of Null as a value for the id member in a Request object
        is discouraged, because this specification uses a value of Null for
        Responses with an unknown id. Also, because JSON-RPC 1.0 uses an id
        value of Null for Notifications this could cause confusion in handling.


        \[2\] Fractional parts may be problematic, since many decimal fractions
        cannot be represented exactly as binary fractions.
      anyOf:
        - title: "Null"
          description: The JSON-RPC `null` request id.
          type: "null"
        - title: Number
          description: A numeric JSON-RPC request id.
          type: integer
          format: int64
        - title: Str
          description: A string JSON-RPC request id.
          type: string
    AcpWriteTextFileRequest:
      description: |-
        Request to write content to a text file.

        Only available if the client supports the `fs.writeTextFile` capability.
      type: object
      properties:
        sessionId:
          description: The session ID for this request.
          allOf:
            - $ref: "#/components/schemas/AcpSessionId"
        path:
          description: Absolute path to the file to write.
          type: string
        content:
          description: The text content to write to the file.
          type: string
        _meta:
          description: |-
            The _meta property is reserved by ACP to allow clients and agents to attach additional
            metadata to their interactions. Implementations MUST NOT make assumptions about values at
            these keys.

            See protocol docs: [Extensibility](https://agentclientprotocol.com/protocol/v1/draft/extensibility)
          type:
            - object
            - "null"
          x-deserialize-default-on-error: true
          additionalProperties: true
      required:
        - sessionId
        - path
        - content
      x-side: client
      x-method: fs/write_text_file
    AcpSessionId:
      description: |-
        A unique identifier for a conversation session between a client and agent.

        Each session has its own context, conversation history, and state, so one
        agent can run several independent sessions.

        See protocol docs: [Session ID](https://agentclientprotocol.com/protocol/v1/draft/session-setup#session-id)
      type: string
    AcpReadTextFileRequest:
      description: |-
        Request to read content from a text file.

        Only available if the client supports the `fs.readTextFile` capability.
      type: object
      properties:
        sessionId:
          description: The session ID for this request.
          allOf:
            - $ref: "#/components/schemas/AcpSessionId"
        path:
          description: Absolute path to the file to read.
          type: string
        line:
          description: Line number to start reading from (1-based).
          type:
            - integer
            - "null"
          format: uint32
          minimum: 0
        limit:
          description: Maximum number of lines to read.
          type:
            - integer
            - "null"
          format: uint32
          minimum: 0
        _meta:
          description: |-
            The _meta property is reserved by ACP to allow clients and agents to attach additional
            metadata to their interactions. Implementations MUST NOT make assumptions about values at
            these keys.

            See protocol docs: [Extensibility](https://agentclientprotocol.com/protocol/v1/draft/extensibility)
          type:
            - object
            - "null"
          x-deserialize-default-on-error: true
          additionalProperties: true
      required:
        - sessionId
        - path
      x-side: client
      x-method: fs/read_text_file
    AcpRequestPermissionRequest:
      description: |-
        Request for user permission to execute a tool call.

        Sent when the agent needs authorization before performing a sensitive operation.

        See protocol docs: [Requesting Permission](https://agentclientprotocol.com/protocol/v1/draft/tool-calls#requesting-permission)
      type: object
      properties:
        sessionId:
          description: The session ID for this request.
          allOf:
            - $ref: "#/components/schemas/AcpSessionId"
        toolCall:
          description: Details about the tool call requiring permission.
          allOf:
            - $ref: "#/components/schemas/AcpToolCallUpdate"
        options:
          description: Available permission options for the user to choose from.
          type: array
