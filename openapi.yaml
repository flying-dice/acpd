        Standard errors use the JSON-RPC 2.0 codes. ACP-specific errors use the
        JSON-RPC

        server-error range (-32000 to -32099), and request cancellation uses
        -32800 from the

        range LSP reserves (-32899 to -32800).
      anyOf:
        - title: Parse error
          description: |-
            **Parse error**: Invalid JSON was received by the server.
            An error occurred on the server while parsing the JSON text.
          type: integer
          format: int32
          const: -32700
        - title: Invalid request
          description: "**Invalid request**: The JSON sent is not a valid Request object."
          type: integer
          format: int32
          const: -32600
        - title: Method not found
          description: "**Method not found**: The method does not exist or is not
            available."
          type: integer
          format: int32
          const: -32601
        - title: Invalid params
          description: "**Invalid params**: Invalid method parameter(s)."
          type: integer
          format: int32
          const: -32602
        - title: Internal error
          description: "**Internal error**: Internal JSON-RPC error."
          type: integer
          format: int32
          const: -32603
        - title: Request cancelled
          description: >-
            **Request cancelled**: Execution of the method was aborted either
            due to a cancellation request from the caller or

            because of resource constraints or shutdown.
          type: integer
          format: int32
          const: -32800
        - title: Authentication required
          description: "**Authentication required**: Authentication is required before
            this operation can be performed."
          type: integer
          format: int32
          const: -32000
        - title: Resource not found
          description: "**Resource not found**: A given resource, such as a session or
            file, was not found."
          type: integer
          format: int32
          const: -32002
        - title: Other
          description: Other undefined error code.
          type: integer
          format: int32
