            Optional. Omitted and `null` are equivalent and mean `exclude`. Only
            send this when

            the Agent advertises the `sessionCapabilities.archive` capability.
            The filter combines with `cwd` and

            applies before pagination. Clients keep the same value when
            following `nextCursor`.
          anyOf:
