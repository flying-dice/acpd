            $ref: "#/components/schemas/AcpPermissionOption"
        _meta:
          description: |-
            The _meta property is reserved by ACP to allow clients and agents to attach additional
            metadata to their interactions. Implementations MUST NOT make assumptions about values at
            these keys.

            See protocol docs: [Extensibility](https://agentclientprotocol.com/protocol/v1/draft/extensibility)
          type:
            - object
            - "null"
          x-deserialize-default-on-error: true
          additionalProperties: true
      required:
        - sessionId
        - toolCall
        - options
      x-side: client
      x-method: session/request_permission
    AcpToolCallUpdate:
      description: |-
        An update to an existing tool call.

        Used to report progress and results as tools execute. All fields except
        the tool call ID are optional - only changed fields need to be included.

        See protocol docs: [Updating](https://agentclientprotocol.com/protocol/v1/draft/tool-calls#updating)
      type: object
