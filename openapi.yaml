    AcpToolCallId:
      description: Unique identifier for a tool call within a session.
      type: string
    AcpToolKind:
      description: |-
        Categories of tools that can be invoked.

        Tool kinds help clients choose appropriate icons and optimize how they
        display tool execution progress.

        See protocol docs: [Creating](https://agentclientprotocol.com/protocol/v1/draft/tool-calls#creating)
      oneOf:
        - description: Reading files or data.
          type: string
          const: read
        - description: Modifying files or content.
          type: string
          const: edit
        - description: Removing files or data.
          type: string
          const: delete
        - description: Moving or renaming files.
          type: string
          const: move
        - description: Searching for information.
          type: string
          const: search
        - description: Running commands or code.
          type: string
          const: execute
        - description: Internal reasoning or planning.
          type: string
          const: think
        - description: Retrieving external data.
          type: string
          const: fetch
        - description: Switching the current session mode.
          type: string
          const: switch_mode
        - description: Other tool types (default).
          type: string
          const: other
    AcpToolCallStatus:
      description: |-
        Execution status of a tool call.

        Tool calls progress through different statuses during their lifecycle.

        See protocol docs: [Status](https://agentclientprotocol.com/protocol/v1/draft/tool-calls#status)
      oneOf:
        - description: |-
            The tool call hasn't started running yet because the input is either
            streaming or we're awaiting approval.
          type: string
          const: pending
        - description: The tool call is currently running.
          type: string
          const: in_progress
        - description: The tool call completed successfully.
          type: string
          const: completed
        - description: The tool call failed with an error.
          type: string
          const: failed
    AcpToolCallContent:
      description: |-
        Content produced by a tool call.

        Tool calls can produce different types of content including
        standard content blocks (text, images) or file diffs.

        See protocol docs: [Content](https://agentclientprotocol.com/protocol/v1/draft/tool-calls#content)
      oneOf:
        - description: Standard content block (text, images, resources).
          type: object
          properties:
            type:
              type: string
              const: content
          required:
            - type
          allOf:
            - $ref: "#/components/schemas/AcpContent"
        - description: File modification shown as a diff.
          type: object
          properties:
            type:
              type: string
              const: diff
          required:
            - type
          allOf:
            - $ref: "#/components/schemas/AcpDiff"
        - description: |-
            Embed a terminal created with `terminal/create` by its id.

            The terminal MUST be added before calling `terminal/release`.

            See protocol docs: [Terminal](https://agentclientprotocol.com/protocol/v1/draft/terminals)
          type: object
          properties:
            type:
              type: string
              const: terminal
          required:
            - type
          allOf:
            - $ref: "#/components/schemas/AcpTerminal"
        - description: |-
            A display-only reference to another session, such as a subagent.

            Agents send it only when the Client advertised the `subagents` Client
            capability.

            See protocol docs: [Sessions](https://agentclientprotocol.com/protocol/v1/draft/tool-calls#sessions)
          type: object
          properties:
            type:
              type: string
              const: session
          required:
            - type
          allOf:
            - $ref: "#/components/schemas/AcpSessionReference"
      discriminator:
        propertyName: type
    AcpContentBlock:
      description: >-
        Content blocks represent displayable information in the Agent Client
        Protocol.


        Content blocks appear in:

        - User prompts sent via `session/prompt`

        - Language model output streamed through `session/update` notifications

        - Progress updates and results from tool calls


        This structure is compatible with the Model Context Protocol (MCP), so
        agents can

        forward content from MCP tool outputs without transformation.


        See protocol docs:
        [Content](https://agentclientprotocol.com/protocol/v1/draft/content)
      oneOf:
        - description: |-
            Text content. May be plain text or formatted with Markdown.

            All agents MUST support text content blocks in prompts.
            Clients SHOULD render this text as Markdown.
          type: object
          properties:
            type:
              type: string
              const: text
          required:
            - type
          allOf:
            - $ref: "#/components/schemas/AcpTextContent"
        - description: |-
            Images for visual context or analysis.

            Requires the `image` prompt capability when included in prompts.
          type: object
          properties:
            type:
              type: string
              const: image
          required:
            - type
          allOf:
            - $ref: "#/components/schemas/AcpImageContent"
        - description: |-
            Audio data for transcription or analysis.

            Requires the `audio` prompt capability when included in prompts.
          type: object
          properties:
            type:
              type: string
              const: audio
          required:
            - type
          allOf:
            - $ref: "#/components/schemas/AcpAudioContent"
        - description: |-
            References to resources that the agent can access.

            All agents MUST support resource links in prompts.
          type: object
          properties:
            type:
              type: string
              const: resource_link
          required:
            - type
          allOf:
            - $ref: "#/components/schemas/AcpResourceLink"
        - description: >-
            Complete resource contents embedded directly in the message.


            Preferred for including context as it avoids extra round-trips.


            Requires the `embeddedContext` prompt capability when included in
            prompts.
          type: object
          properties:
            type:
              type: string
              const: resource
          required:
            - type
          allOf:
            - $ref: "#/components/schemas/AcpEmbeddedResource"
      discriminator:
        propertyName: type
