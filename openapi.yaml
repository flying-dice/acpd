    AcpForkSessionRequest:
      description: >-
        **UNSTABLE**


        This capability is not part of the spec yet, and may be removed or
        changed at any point.


        Request parameters for forking an existing session.


        Creates a new session based on the context of an existing one, allowing

        operations like generating summaries without affecting the original
        session's history.


        Only available if the Agent supports the `session.fork` capability.
      type: object
      properties:
        sessionId:
          description: The ID of the session to fork.
          allOf:
            - $ref: "#/components/schemas/AcpSessionId"
        cursorId:
          description: >-
            **UNSTABLE**


            This capability is not part of the spec yet, and may be removed or
            changed at any point.


            The session cursor to fork at. The new session's history is the
            source

            session's history before the cursor.


            Optional. Omitted and `null` are equivalent and fork the whole
            session.

            Clients MUST only send the ID of a cursor that the Agent announced
            on the

            source session and that currently advertises `capabilities.fork`.
            The Agent

            rejects any other ID with `-32602`. It does not fall back to forking
            the

            whole session.
          anyOf:
            - $ref: "#/components/schemas/AcpCursorId"
            - type: "null"
        cwd:
          description: The working directory for this session. Must be an absolute path.
          type: string
        additionalDirectories:
          description: >-
            Additional workspace roots to activate for this session. Each path
            MUST be absolute.


            When omitted or empty, no additional roots are activated. When
            non-empty,

            this is the complete resulting additional-root list for the forked

            session.
          type: array
          items:
            type: string
          x-deserialize-default-on-null: true
        mcpServers:
          description: List of MCP servers to connect to for this session.
          type: array
          items:
            $ref: "#/components/schemas/AcpMcpServer"
          x-deserialize-default-on-null: true
        systemPrompt:
          description: >-
            System-level instructions for the forked session.


            Optional. Omitted and `null` are equivalent. The Agent MAY then keep
            a

            system prompt it stored with the source session or use its default

            instructions. Clients MUST only send this when the Agent advertises

            `sessionCapabilities.systemPrompt`, and SHOULD send the same value
            they used

            for the source session.
          anyOf:
            - $ref: "#/components/schemas/AcpSystemPrompt"
            - type: "null"
        configOptions:
          description: >-
            **UNSTABLE**


            This capability is not part of the spec yet, and may be removed or
            changed at any point.


            Initial values for the forked session's config options.


            Optional. Omitted and `null` are equivalent to an empty list.
            Clients MUST only send

            this when the Agent advertises `sessionCapabilities.options`.


            The Agent applies the entries in list order on top of the
            configuration the fork

            starts with, as if the Client had called `session/set_config_option`
            for each entry

            after the session was set up. Malformed entries and duplicate
            `configId` values fail

            the request with `-32602`. The Agent MUST ignore an entry whose
            `configId` is unknown,

            whose `type` does not match the option, or whose value is not
            allowed when it is

            applied. The `configOptions` in the response contain the values the
            session actually

            has. The Agent SHOULD NOT send `config_option_update` notifications
            for these entries,

            and SHOULD NOT send other `session/update` notifications caused by
            applying them

            before it responds.
          type: array
          items:
            $ref: "#/components/schemas/AcpInitialSessionConfigOption"
          x-deserialize-default-on-null: true
        _meta:
          description: |-
            The _meta property is reserved by ACP to allow clients and agents to attach additional
            metadata to their interactions. Implementations MUST NOT make assumptions about values at
            these keys.

            See protocol docs: [Extensibility](https://agentclientprotocol.com/protocol/v1/draft/extensibility)
          type:
            - object
            - "null"
          x-deserialize-default-on-error: true
          additionalProperties: true
      required:
        - sessionId
        - cwd
      x-side: agent
      x-method: session/fork
    AcpArchiveSessionRequest:
      description: >-
        **UNSTABLE**


        This capability is not part of the spec yet, and may be removed or
        changed at any point.


        Request parameters for archiving a session.


        Only available if the Agent supports the `sessionCapabilities.archive`
        capability.


        Archiving hides the session from default `session/list` results. It
        keeps the session ID

        and saved history. If the session is active, the Agent MUST cancel any
        ongoing work and

        free the session's resources as if `session/close` had been called, then
        archive it.

        Archiving an archived session succeeds. A session that does not exist
        gets `-32002`.
      type: object
      properties:
        sessionId:
          description: The ID of the session to archive.
          allOf:
            - $ref: "#/components/schemas/AcpSessionId"
        _meta:
          description: |-
            The _meta property is reserved by ACP to allow clients and agents to attach additional
            metadata to their interactions. Implementations MUST NOT make assumptions about values at
            these keys.

            See protocol docs: [Extensibility](https://agentclientprotocol.com/protocol/v1/draft/extensibility)
          type:
            - object
            - "null"
          x-deserialize-default-on-error: true
          additionalProperties: true
      required:
        - sessionId
      x-side: agent
      x-method: session/archive
    AcpUnarchiveSessionRequest:
      description: >-
        **UNSTABLE**


        This capability is not part of the spec yet, and may be removed or
        changed at any point.


        Request parameters for unarchiving a session.


        Only available if the Agent supports the `sessionCapabilities.archive`
        capability.


        Unarchiving returns the session to default `session/list` results with
        the same ID and

        saved history. It never loads or resumes the session. Clients that want
        to continue an

        archived session SHOULD unarchive it before calling `session/load` or
        `session/resume`.

        Unarchiving a session that is not archived succeeds. A session that does
        not exist

        gets `-32002`.
      type: object
      properties:
        sessionId:
          description: The ID of the session to unarchive.
          allOf:
            - $ref: "#/components/schemas/AcpSessionId"
        _meta:
          description: |-
            The _meta property is reserved by ACP to allow clients and agents to attach additional
            metadata to their interactions. Implementations MUST NOT make assumptions about values at
            these keys.

            See protocol docs: [Extensibility](https://agentclientprotocol.com/protocol/v1/draft/extensibility)
          type:
            - object
            - "null"
          x-deserialize-default-on-error: true
          additionalProperties: true
      required:
        - sessionId
      x-side: agent
      x-method: session/unarchive
    AcpSessionStatusRequest:
      description: >-
        **UNSTABLE**


        This capability is not part of the spec yet, and may be removed or
