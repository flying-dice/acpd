            - mode
          anyOf:
            - title: Session
              description: Tied to a session, optionally to a specific tool call within that
                session.
              allOf:
                - $ref: "#/components/schemas/AcpElicitationSessionScope"
            - title: Request
              description: >-
                Tied to a specific JSON-RPC request outside of a session

                (e.g., during auth/configuration phases before any session is
                started).
              allOf:
                - $ref: "#/components/schemas/AcpElicitationRequestScope"
          unevaluatedProperties: true
