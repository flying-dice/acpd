          const: exclude
        - description: Both archived sessions and sessions that are not archived.
          type: string
          const: include
        - description: Only archived sessions.
          type: string
          const: only
        - title: other
          description: >-
            Custom or future archive filter.


            Values beginning with `_` are reserved for implementation-specific

            extensions. Unknown values that do not begin with `_` are reserved
            for

            future ACP variants.
          type: string
    AcpDeleteSessionRequest:
      description: >-
        Request parameters for deleting an existing session from `session/list`.


        Only available if the Agent supports the `sessionCapabilities.delete`
        capability.
