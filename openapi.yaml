          properties:
            mode:
              type: string
              const: form
          required:
            - mode
          allOf:
            - $ref: "#/components/schemas/AcpElicitationFormMode"
        - description: URL-based elicitation where the client directs the user to a URL.
          type: object
          properties:
            mode:
              type: string
              const: url
          required:
            - mode
          allOf:
            - $ref: "#/components/schemas/AcpElicitationUrlMode"
        - title: other
          description: >-
            Custom or future elicitation mode.


            Values beginning with `_` are reserved for implementation-specific

            extensions. Unknown values that do not begin with `_` are reserved
            for

            future ACP variants.


            Clients that do not understand this mode SHOULD preserve the raw
            payload

            when storing, replaying, proxying, or forwarding elicitation
            requests.

            They MUST NOT render it as a known elicitation mode.
