                    removed or changed at any point.


                    Queries the agent's current authentication state.


                    This method is only available if the agent advertises the
                    `auth.status` capability.

                    It MUST NOT change any agent state, and agents MUST NOT
                    reject it with `auth_required`.
                  allOf:
                    - $ref: "#/components/schemas/AcpAuthStatusRequest"
