                    This capability is not part of the spec yet, and may be
                    removed or changed at any point.


                    Lists providers that can be configured by the client.
                  allOf:
                    - $ref: "#/components/schemas/AcpListProvidersRequest"
                - title: SetProviderRequest
                  description: >-
                    **UNSTABLE**


                    This capability is not part of the spec yet, and may be
                    removed or changed at any point.


                    Replaces the configuration for a provider.
                  allOf:
                    - $ref: "#/components/schemas/AcpSetProviderRequest"
                - title: DisableProviderRequest
                  description: >-
                    **UNSTABLE**


                    This capability is not part of the spec yet, and may be
                    removed or changed at any point.


                    Disables a provider.
                  allOf:
                    - $ref: "#/components/schemas/AcpDisableProviderRequest"
                - title: LogoutRequest
                  description: >-
                    Logs out of the current authenticated state.


                    After a successful logout, all new sessions will require
                    authentication.

                    There is no guarantee about the behavior of already running
                    sessions.
