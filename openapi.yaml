                  description: >-
                    **UNSTABLE**


                    This capability is not part of the spec yet, and may be
                    removed or changed at any point.


                    Checks whether the Agent has a session in memory, without
                    changing it.


                    This method is only available if the agent advertises the
                    `sessionCapabilities.status` capability.
                  allOf:
                    - $ref: "#/components/schemas/AcpSessionStatusRequest"
                - title: SessionOptionsRequest
                  description: >-
                    **UNSTABLE**


                    This capability is not part of the spec yet, and may be
                    removed or changed at any point.


                    Returns the config options a session would start with,
                    without creating or resuming a session.


                    This method is only available if the agent advertises the
                    `sessionCapabilities.options` capability.
                  allOf:
                    - $ref: "#/components/schemas/AcpSessionOptionsRequest"
                - title: SetSessionTitleRequest
                  description: >-
                    **UNSTABLE**


                    This capability is not part of the spec yet, and may be
                    removed or changed at any point.


                    Sets the title of a session.


                    This method is only available if the agent advertises the
                    `sessionCapabilities.title` capability.


                    The session does not need to be active on the connection.
                    The agent stores the

                    title and returns the stored title, which may be normalized.
                  allOf:
                    - $ref: "#/components/schemas/AcpSetSessionTitleRequest"
                - title: ResumeSessionRequest
                  description: >-
                    Resumes an existing session without returning previous
                    messages.


                    This method is only available if the agent advertises the
                    `sessionCapabilities.resume` capability.


                    The agent should resume the session context, allowing the
                    conversation to continue

                    without replaying the message history (unlike
                    `session/load`).
                  allOf:
                    - $ref: "#/components/schemas/AcpResumeSessionRequest"
                - title: CloseSessionRequest
                  description: >-
                    Closes an active session and frees up any resources
                    associated with it.


                    This method is only available if the agent advertises the
                    `sessionCapabilities.close` capability.


                    The agent MUST cancel any ongoing work (as if
                    `session/cancel` was called)

                    and then free up any resources associated with the session.
                  allOf:
                    - $ref: "#/components/schemas/AcpCloseSessionRequest"
                - title: SetSessionModeRequest
                  description: |-
                    Sets the current mode for a session.

                    Allows switching between different agent modes (e.g., "ask", "architect", "code")
                    that affect system prompts, tool availability, and permission behaviors.

                    The mode MUST be one of the modes advertised in `availableModes` during session
                    creation or loading. Agents may also change modes autonomously and notify the
                    client via `current_mode_update` notifications.

                    This method can be called at any time during a session, whether the Agent is
                    idle or actively generating a response.

                    See protocol docs: [Session Modes](https://agentclientprotocol.com/protocol/v1/draft/session-modes)
                  allOf:
                    - $ref: "#/components/schemas/AcpSetSessionModeRequest"
                - title: SetSessionConfigOptionRequest
                  description: Sets the current value for a session configuration option.
                  allOf:
                    - $ref: "#/components/schemas/AcpSetSessionConfigOptionRequest"
                - title: PromptRequest
                  description: |-
                    Processes a user prompt within a session.

                    This method handles the whole lifecycle of a prompt:
                    - Receives user messages with optional context (files, images, etc.)
                    - Processes the prompt using language models
                    - Reports language model content and tool calls to the Clients
                    - Requests permission to run tools
                    - Executes any requested tool calls
                    - Returns when the turn is complete with a stop reason

                    See protocol docs: [Prompt Turn](https://agentclientprotocol.com/protocol/v1/draft/prompt-turn)
                  allOf:
                    - $ref: "#/components/schemas/AcpPromptRequest"
                - title: ExtMethodRequest
                  description: |-
                    Handles extension method requests from the client.

                    Extension methods provide a way to add custom functionality while maintaining
                    protocol compatibility.

                    See protocol docs: [Extensibility](https://agentclientprotocol.com/protocol/v1/draft/extensibility)
                  allOf:
                    - $ref: "#/components/schemas/AcpExtRequest"
            - type: "null"
      required:
        - id
        - method
      x-docs-ignore: true
