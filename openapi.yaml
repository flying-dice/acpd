                  - $ref: "#/components/schemas/HttpError"
                properties:
                  error:
                    const: upgrade_failed
                  message:
                    const: The WebSocket handshake could not be completed.
        "403":
          description: Cross-origin ACP connections are not allowed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HttpError"
                properties:
                  error:
                    const: forbidden
                  message:
                    const: Cross-origin ACP connections are not allowed.
        "404":
          description: agentId does not name a configured agent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HttpError"
                properties:
                  error:
                    const: unknown_agent
                  message:
                    const: agentId does not name a configured agent.
        "426":
          description: Connect with a WebSocket.
          headers:
