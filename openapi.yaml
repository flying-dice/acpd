                    - $ref: "#/components/schemas/AcpForkSessionRequest"
                - title: ArchiveSessionRequest
                  description: >-
                    **UNSTABLE**


                    This capability is not part of the spec yet, and may be
                    removed or changed at any point.


                    Archives a session, hiding it from default `session/list`
                    results.


                    This method is only available if the agent advertises the
                    `sessionCapabilities.archive` capability.
                  allOf:
                    - $ref: "#/components/schemas/AcpArchiveSessionRequest"
                - title: UnarchiveSessionRequest
                  description: >-
                    **UNSTABLE**


                    This capability is not part of the spec yet, and may be
                    removed or changed at any point.


                    Unarchives a session, returning it to default `session/list`
                    results.


                    This method is only available if the agent advertises the
                    `sessionCapabilities.archive` capability.
