info:
  title: acpd
  version: 0.1.0
  summary: Minimal Agent Client Protocol (ACP) proxy over WebSocket.
  description: >-
    acpd connects remote ACP clients to stdio ACP agents listed in its config
    file. This document covers the HTTP handshake and the message schemas;
    `asyncapi.yaml` describes the WebSocket channel and its messages.


    After `101 Switching Protocols`, each WebSocket text frame in either
    direction carries one `JsonRpcMessage`. acpd validates every frame against
    that schema, and validates `params` and `result` against ACP v1.
    `initialize` must come first and the agent must answer with protocol version
    1. It answers an invalid request with `-32600` (bad envelope), `-32601`
    (method not in ACP), or `-32602` (bad params). It replaces an invalid
    response with `-32603` and drops an invalid notification. Methods starting
    with `_` are ACP extensions and get envelope checks only. See
    https://agentclientprotocol.com.
paths:
  /acp:
    get:
      operationId: connectAcp
      summary: Open an ACP connection over WebSocket.
      description: Starts the selected agent's process and upgrades to a WebSocket.
        Send `initialize` first. Closing the socket stops the agent process, and
        the socket closes if the process exits.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: websocket
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            const: Upgrade
        - name: Sec-WebSocket-Version
          in: header
          required: true
          schema:
            type: string
            const: "13"
        - name: Sec-WebSocket-Key
          in: header
          required: true
          description: Base64 of 16 random bytes (RFC 6455).
          schema:
            type: string
        - name: Origin
          in: header
          required: false
          description: If present, its host must equal the request's `Host`.
          schema:
            type: string
      responses:
        "101":
          description: Switched to the ACP WebSocket transport. Frames carry
            `JsonRpcMessage` values.
          headers:
            Acp-Connection-Id:
              required: true
              description: Transport-level identifier for this ACP connection.
              schema:
                type: string
            Upgrade:
              required: true
              schema:
                type: string
                const: websocket
            Sec-WebSocket-Accept:
              required: true
              schema:
                type: string
