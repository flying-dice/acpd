    AcpSystemPrompt:
      description: >-
        Client-provided system-level instructions for a session.


        Clients MUST only send this when the Agent advertises

        `sessionCapabilities.systemPrompt`. Agents that cannot apply it, for
        example

        because of an unadvertised mode or an unsupported content block type,
        MUST

        return an error instead of creating, loading, or resuming the session.
      type: object
      properties:
        mode:
          description: >-
            How the Agent combines `content` with its own instructions.


            Required. Agents MUST return an error for a mode they do not support
            rather than

            treating it as `append` or `override`.
          allOf:
            - $ref: "#/components/schemas/AcpSystemPromptMode"
        content:
          description: |-
            The system prompt content.

            Agents advertising the capability MUST accept `text` content blocks.
            Clients MUST NOT send other content block types until a future
            capability allows them, and Agents MUST return an error for content
            blocks they do not support.

            Clients MUST NOT send an empty array. Agents MAY reject one with
            `-32602` without creating, loading, or resuming the session.
          type: array
          items:
            $ref: "#/components/schemas/AcpContentBlock"
        _meta:
          description: |-
            The _meta property is reserved by ACP to allow clients and agents to attach additional
            metadata to their interactions. Implementations MUST NOT make assumptions about values at
            these keys.

            See protocol docs: [Extensibility](https://agentclientprotocol.com/protocol/v1/draft/extensibility)
          type:
            - object
            - "null"
          x-deserialize-default-on-error: true
          additionalProperties: true
      required:
        - mode
        - content
    AcpSystemPromptMode:
      description: >-
        How the Agent combines a client-provided system prompt with its own
        instructions.


        Unknown modes are preserved so they can be stored,

        proxied, or forwarded. An Agent MUST return an error for a mode it does
        not

        support rather than treating it as `append` or `override`.
      anyOf:
        - description: >-
            Add the content to the Agent's own instructions rather than
            replacing them.


            Every Agent that advertises `sessionCapabilities.systemPrompt`
            supports this mode.

            Agents SHOULD give the content system-level precedence, for example
            in the

            model's system prompt or developer instructions rather than in
            user-turn

            content. Where it is placed and how it is formatted is
            implementation-defined.
          type: string
          const: append
        - description: >-
            Replace the Agent's built-in default instructions with the content.


            This does not change tool availability, MCP servers, permissions, or
            session

            configuration. Context the Agent supplies from the workspace or
            environment

            MAY still be included. Clients that use this mode take
            responsibility for any

            tool guidance or safety instructions the Agent's default
            instructions

            provided, and MUST only use it when the Agent advertises

            `sessionCapabilities.systemPrompt.mode.override`.
          type: string
          const: override
        - title: other
          description: >-
            Custom or future system prompt mode.


            Values beginning with `_` are reserved for implementation-specific

            extensions. Unknown values that do not begin with `_` are reserved
            for

            future ACP variants.
          type: string
